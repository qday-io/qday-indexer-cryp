# Pull the image published by .github/workflows/build.yml:
#   cp .env.example .env
#   docker compose pull && docker compose up
#
# Pushes to main/master publish ghcr.io/qday-io/qday-indexer-cryp:latest.
# Run the workflow manually to set another tag, or push a v* git tag.

services:
  qday-index:
    image: ghcr.io/qday-io/qday-indexer-cryp:latest
    environment:
      FROM_BLOCK: ${FROM_BLOCK:-1}
      TO_BLOCK: ${TO_BLOCK:-}
      CONFIRM: ${CONFIRM:-0}
      BATCH: ${BATCH:-1000}
      RPC_URL: ${RPC_URL:-}
      RAW_DIR: ${RAW_DIR:-/data/raw_txs}
      CONCURRENCY: ${CONCURRENCY:-8}
      RPC_BATCH: ${RPC_BATCH:-20}
      RESUME: ${RESUME:-false}
    volumes:
      - ./data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    init: true
    restart: "no"
